# Builds a release when a version tag (v1.2.3) is pushed and puts it up as a DRAFT.
# The draft is NOT visible to the program's updater. The maintainer then signs the files on their
# own PC (tools/sign-release.ps1) – the signing key never touches GitHub – and publishes.
name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write       # create the draft release
      id-token: write       # build attestation
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Tag matches Cargo.toml
        id: ver
        shell: pwsh
        run: |
          $v = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"(.+)"').Matches[0].Groups[1].Value
          if ("v$v" -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }} does not match Cargo.toml version $v" }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Tests
        run: cargo test --locked

      - name: Build
        run: cargo build --release --locked

      - name: Licence list
        shell: pwsh
        run: |
          cargo install cargo-about --locked --features cli
          New-Item -ItemType Directory -Force dist | Out-Null
          cargo about generate --locked -o dist/THIRD_PARTY_LICENSES.html about.hbs

      - name: Installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $iscc = Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup*\ISCC.exe", "$env:ProgramFiles\Inno Setup*\ISCC.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          & $iscc.FullName /Qp "/DAppVersion=${{ steps.ver.outputs.version }}" installer/MrPhotoPrint.iss
          if ($LASTEXITCODE -ne 0) { throw 'ISCC failed' }

      - name: Portable ZIP and checksums
        shell: pwsh
        run: |
          $v = '${{ steps.ver.outputs.version }}'
          $stage = "dist/MrPhotoPrint-$v"
          New-Item -ItemType Directory $stage | Out-Null
          Copy-Item target/release/MrPhotoPrint.exe, LICENSE-MIT, LICENSE-APACHE, installer/PORTABLE.txt, dist/THIRD_PARTY_LICENSES.html $stage
          Compress-Archive -Path "$stage/*" -DestinationPath "dist/MrPhotoPrint-$v-portable.zip"
          Remove-Item -Recurse $stage
          Push-Location dist
          Get-ChildItem "MrPhotoPrint-Setup-$v.exe", "MrPhotoPrint-$v-portable.zip" | ForEach-Object {
            "{0} *{1}" -f (Get-FileHash $_ -Algorithm SHA256).Hash.ToLower(), $_.Name
          } | Set-Content -Encoding ascii SHA256SUMS.txt
          Get-Content SHA256SUMS.txt
          Pop-Location

      - name: Build attestation
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/MrPhotoPrint-Setup-${{ steps.ver.outputs.version }}.exe
            dist/MrPhotoPrint-${{ steps.ver.outputs.version }}-portable.zip

      - name: Release notes from CHANGELOG.md
        shell: pwsh
        run: |
          $v = '${{ steps.ver.outputs.version }}'
          $lines = Get-Content CHANGELOG.md
          $start = ($lines | Select-String -Pattern "^## \[$([regex]::Escape($v))\]").LineNumber
          if (-not $start) { throw "CHANGELOG.md has no section for $v" }
          $rest = $lines[$start..($lines.Count - 1)]
          $end = ($rest | Select-String -Pattern '^## ' | Select-Object -First 1).LineNumber
          $body = if ($end) { $rest[0..($end - 2)] } else { $rest }
          $body | Set-Content -Encoding utf8 dist/notes.md

      - name: Draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = '${{ steps.ver.outputs.version }}'
          gh release create "${{ github.ref_name }}" --draft --verify-tag --title "Mr. PhotoPrint $v" --notes-file dist/notes.md `
            "dist/MrPhotoPrint-Setup-$v.exe" "dist/MrPhotoPrint-$v-portable.zip" dist/SHA256SUMS.txt dist/THIRD_PARTY_LICENSES.html
